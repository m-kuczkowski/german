name: Generate static AI translations
# This workflow deletes itself after a successful one-time static build.

on:
  push:
    branches: [main]
    paths:
      - data/nicosWegSource.json
      - scripts/translate-nicos-weg.mjs
      - .github/workflows/generate-static-translations.yml
  workflow_dispatch:
    inputs:
      model:
        description: Model used for the one-time translation pass
        required: false
        default: gpt-5.6

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate all Polish translations and context sentences
        env:
          OPENAI_API_KEY: ${{ secrets.SECRET_KEY }}
          OPENAI_MODEL: ${{ inputs.model || 'gpt-5.6' }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error title=Missing SECRET_KEY::Dodaj SECRET_KEY do Actions secrets dla tego repozytorium."
            exit 1
          fi
          node scripts/translate-nicos-weg.mjs
      - name: Build the static card dataset
        run: node scripts/build-static-cards.mjs data/nicosWegSource.json data/nicosWegTranslations.json
      - name: Update migration and dataset expectations
        run: node scripts/finalize-static-set.mjs
      - name: Verify the generated dataset
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run build
      - name: Commit the static result and remove the one-time API integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nicosWegTranslations.json src/data/nicosWegCards.ts src/lib/storage.ts tests/cards.test.ts tests/storage.test.ts
          git rm scripts/translate-nicos-weg.mjs scripts/finalize-static-set.mjs .github/workflows/generate-static-translations.yml
          git commit -m "Generate complete static Nicos Weg translations"
          git push
